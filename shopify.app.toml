# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "7626ea812d767cccda0852c3c80a07bb"
name = "Citely"
application_url = "https://citely-fawn.vercel.app/app"
embedded = true

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "write_products,write_content,read_products,read_orders"

[product.metafields.app.demo_info] 
type = "single_line_text_field"
name = "Demo Source Info"
description = "Tracks products created by the Shopify app template for development"

  [product.metafields.app.demo_info.access]
  admin = "merchant_read_write"

[metaobjects.app.example]
name = "Example"
description = "An example metaobject definition created by this template"

  [metaobjects.app.example.access]
  admin = "merchant_read_write"

[metaobjects.app.example.fields.title]
name = "Title"
type = "single_line_text_field"
required = true

[metaobjects.app.example.fields.description]
name = "Description"
type = "multi_line_text_field"

[webhooks]
api_version = "2026-07"

  # Use absolute URLs — application_url ends in /app, so relative
  # "/webhooks/..." would resolve to /app/webhooks/... (404).
  [[webhooks.subscriptions]]
  uri = "https://citely-fawn.vercel.app/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "https://citely-fawn.vercel.app/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  # Mandatory App Store privacy webhooks (GDPR/CPRA)
  # https://shopify.dev/docs/apps/build/compliance/privacy-law-compliance
  [[webhooks.subscriptions]]
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]
  uri = "https://citely-fawn.vercel.app/webhooks/compliance"

[auth]
redirect_urls = [ "https://citely-fawn.vercel.app/auth/callback" ]

[build]
automatically_update_urls_on_dev = true
